name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'ایجاد ریلیز در گیت‌هاب (Create GitHub Release)'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'تگ نسخه (اختیاری، مثلاً v1.0.1)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Keystore & Signing Environment
        id: prep_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Check if release signing secrets are provided
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No release keystore secret found. Will build using debug configuration."
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
          fi
          
          # Prepare .env if needed
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Determine Version Info
        id: version_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
            IS_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_release }}" == "true" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            VERSION_NAME="${TAG#v}"
            IS_RELEASE="true"
          else
            TAG=""
            VERSION_NAME="1.0.0"
            IS_RELEASE="false"
          fi
          
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          echo "VERSION_CODE=$COMMIT_COUNT" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

      - name: Build APK (Release or Debug)
        run: |
          if [ "${{ steps.prep_signing.outputs.has_release_keystore }}" == "true" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease --no-configuration-cache --stacktrace
            mkdir -p artifacts
            cp app/build/outputs/apk/release/*.apk artifacts/WorkerManager-App.apk || find app/build/outputs/apk/ -name "*.apk" -exec cp {} artifacts/WorkerManager-App.apk \;
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-configuration-cache --stacktrace
            mkdir -p artifacts
            cp app/build/outputs/apk/debug/*.apk artifacts/WorkerManager-App.apk || find app/build/outputs/apk/ -name "*.apk" -exec cp {} artifacts/WorkerManager-App.apk \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerManager-APK
          path: artifacts/WorkerManager-App.apk
          retention-days: 30

      - name: Create GitHub Release (Only on v* tag or explicit workflow_dispatch)
        if: steps.version_info.outputs.is_release == 'true' && steps.version_info.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: نسخه ${{ steps.version_info.outputs.tag }} - برنامه مدیریت کارگران
          body: |
            ### 📱 فایل نصبی اندروید (APK)
            - **نسخه:** `${{ steps.version_info.outputs.tag }}`
            - **کد نسخه:** `${{ env.VERSION_CODE }}`
            
            📥 جهت دانلود و نصب روی گوشی اندروید، فایل `WorkerManager-App.apk` را از بخش Assets در پایین دانلود نمایید.
          files: artifacts/WorkerManager-App.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
