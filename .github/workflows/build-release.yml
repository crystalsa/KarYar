name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'ایجاد ریلیز در گیت‌هاب (Create GitHub Release)'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'تگ نسخه (مثلاً v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare Keystore & Environment Files
        run: |
          # 1. بازیابی کلید دیباگ از base64 یا تولید خودکار آن در صورت نبود
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Keystore is ready:"
          ls -la debug.keystore
          
          # 2. آماده‌سازی فایل .env برای پلاگین Secrets
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo ".env created from .env.example."
          elif [ ! -f ".env" ]; then
            touch .env
            echo "Empty .env created."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-configuration-cache --stacktrace
          
          # یافتن فایل APK تولید شده و کپی آن با نام تمیز
          mkdir -p release-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/WorkerManager-App.apk
            echo "APK ready at release-artifacts/WorkerManager-App.apk"
          else
            echo "Searching for generated APKs..."
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-artifacts/WorkerManager-App.apk \;
          fi

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerManager-APK
          path: release-artifacts/WorkerManager-App.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=نسخه $TAG - برنامه مدیریت کارگران" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=نسخه $TAG - برنامه مدیریت کارگران" >> $GITHUB_OUTPUT
          else
            # هنگام هر پوش معمولی به main، ریلیز v1.0.0 به طور خودکار ساخته و فایل APK به آن پیوست می‌شود
            TAG="v1.0.0"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=نسخه رسمی برنامه مدیریت کارگران (v1.0.0)" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ### 📱 فایل نصبی اندروید (APK) آماده دانلود و نصب مستقیم روی گوشی:
            - **نام فایل:** `WorkerManager-App.apk`
            - **نسخه:** `${{ steps.release_info.outputs.tag }}`
            - **ویژگی‌ها:** ارتباط مستقیم مبالغ کارگران با وضعیت حضور و غیاب، ستون اختصاصی نصف روز، مدیریت پوشه‌های روزانه و تقویم شمسی.
            
            📥 **جهت دانلود و نصب روی گوشی اندروید:**
            روی فایل **`WorkerManager-App.apk`** در بخش Assets (در پایین همین بخش) کلیک کنید.
          files: release-artifacts/WorkerManager-App.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
